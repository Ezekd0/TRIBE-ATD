databases:
  - name: tribe-db
    databaseName: tribe_atd
    user: tribe_user

services:
  - type: web
    name: tribe-atd-api
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tribe-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
